<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Unthink AI preview image</title>
  <desc id="desc">Dark gradient card with Unthink AI branding and tagline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#131314" />
      <stop offset="100%" stop-color="#1f1a33" />
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="50%" stop-color="#9B72CB" />
      <stop offset="100%" stop-color="#EA4335" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="1030" cy="120" r="220" fill="#4285F4" fill-opacity="0.15" />
  <circle cx="210" cy="560" r="260" fill="#EA4335" fill-opacity="0.13" />
  <g transform="translate(110 120)">
    <rect width="980" height="390" rx="36" fill="#17181B" stroke="#2E2F34" />
    <text x="70" y="140" font-family="Inter, sans-serif" font-size="72" font-weight="700" fill="#FFFFFF">Unthink AI</text>
    <rect x="70" y="176" width="390" height="8" fill="url(#accent)" rx="4" />
    <text x="70" y="250" font-family="Inter, sans-serif" font-size="38" fill="#D1D5DB">Stop thinking. Start resolving.</text>
    <text x="70" y="312" font-family="Inter, sans-serif" font-size="28" fill="#9CA3AF">One decisive answer for everyday dilemmas.</text>
  </g>
</svg>
